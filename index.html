<script>
// [Deine bestehenden Variablen, SURAS, RECITERS, Funktionen bis TTS unverändert]

let ttsVoices = [];
let ttsVoiceReady = false;

// ✅ WARTE AUF STIMMEN + MÄNNERSTIMME CACHE
function loadTTSVoices() {
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
        ttsVoices = voices;
        ttsVoiceReady = true;
        console.log('✅ Stimmen geladen:', voices.length);
        findBestMaleVoice();
    }
}

// Lade Stimmen mehrmals (iOS/Android brauchen Zeit)
window.speechSynthesis.onvoiceschanged = loadTTSVoices;
setTimeout(loadTTSVoices, 100);
setTimeout(loadTTSVoices, 500);
setTimeout(loadTTSVoices, 1000);

let bestMaleVoice = null;

function findBestMaleVoice() {
    if (!ttsVoiceReady || ttsVoices.length === 0) return null;
    
    console.log('🔍 Suche Männerstimme unter:', ttsVoices.map(v => v.name).join(', '));
    
    // ✅ EXPLIZITE MÄNNERSTIMMEN (getestet auf Chrome, Safari, Firefox)
    const MALE_VOICES = [
        // Chrome/Android
        'Google Deutsch', 'Google deutsch', 'Maximilian', 'Markus', 'Stefan', 'Michael',
        // Safari/iOS  
        'Alex', 'Siri Male', 'de-DE Male',
        // Firefox
        'thorsten', 'male', 'man', 'mann',
        // Fallback
        'de-DE'
    ];
    
    for (let keyword of MALE_VOICES) {
        const voice = ttsVoices.find(v => 
            v.lang.startsWith('de') && 
            (v.name.toLowerCase().includes(keyword.toLowerCase()) || 
             v.name.includes(keyword))
        );
        if (voice) {
            bestMaleVoice = voice;
            console.log('✅ MÄNNERSTIMME GEWÄHLT:', voice.name, '(de:', voice.lang, ')');
            return voice;
        }
    }
    
    // Letzter Fallback: Erste deutsche Stimme
    const fallback = ttsVoices.find(v => v.lang.startsWith('de'));
    bestMaleVoice = fallback;
    console.log('🔄 Fallback Stimme:', fallback ? fallback.name : 'Keine');
    return fallback;
}

function speakViaWebSpeech(text) {
    return new Promise((resolve) => {
        window.speechSynthesis.cancel();
        
        // Warte auf Stimmen falls nötig
        if (!ttsVoiceReady) {
            setTimeout(() => speakViaWebSpeech(text).then(resolve), 200);
            return;
        }
        
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'de-DE';
        utter.rate = 0.85;  // Etwas langsamer
        utter.pitch = 0.7;  // Tiefer = Männlich
        utter.volume = 0.95;
        
        // ✅ VERWENDE BESTE MÄNNERSTIMME
        let voice = bestMaleVoice || findBestMaleVoice();
        
        if (voice) {
            utter.voice = voice;
            console.log('🎙️ Spiele mit Stimme:', voice.name);
        } else {
            console.warn('⚠️ Keine deutsche Stimme gefunden');
        }
        
        utter.onend = () => {
            console.log('✅ TTS beendet');
            resolve(true);
        };
        utter.onerror = (e) => {
            console.error('❌ TTS Fehler:', e.error);
            resolve(false);
        };
        
        window.speechSynthesis.speak(utter);
    });
}

// ✅ ÜBERSCHRIEBE die alte Funktion
window.speakViaWebSpeech = speakViaWebSpeech;

// TTS Button Funktion (unverändert)
function toggleTTS(btn) {
    if (ttsAutoPlay || ttsAudio || window.speechSynthesis?.speaking) { 
        stopTTS(); 
        return; 
    }
    ttsAutoPlay = true;
    player.pause();
    speakVerse(document.getElementById('germanText')?.textContent?.trim() || '');
}

// Test-Button für Debug (optional - entfernen nach Test)
document.addEventListener('DOMContentLoaded', () => {
    console.log('🚀 Iqraa Koran TTS bereit - Männerstimme aktiv! 🎙️');
    
    // Debug: Drücke "T" für Test
    document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
            const testText = "Dies ist ein Test der deutschen Männerstimme.";
            speakViaWebSpeech(testText).then(() => {
                console.log('🧪 Test abgeschlossen');
            });
        }
    });
});

// [Rest deines Codes unverändert: loadBtn.onclick, renderVerse, etc.]
</script>
</body>
